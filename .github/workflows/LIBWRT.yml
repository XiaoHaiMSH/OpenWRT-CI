#CI项目
name: LIBWRT

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [IPQ60XX, IPQ807X]
        SOURCE: [XiaoHaiSly/LibWrt]
        BRANCH: [25.12-nss]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: LibWrt
      #默认WIFI名称
      WRT_SSID: LibWrt
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}

  #发布软件源：两个平台都编译成功才发布，避免整站覆盖时丢掉另一个平台的软件源
  publish:
    name: Publish Feed
    needs: config
    if: ${{ needs.config.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: feed-publish
      cancel-in-progress: false
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Read Feed Name
        run: |
          echo "WRT_FEED=$(bash ./Scripts/Feed.sh domain)" >> "$GITHUB_ENV"
          echo "WRT_PROJECT=$(bash ./Scripts/Feed.sh project)" >> "$GITHUB_ENV"

      - name: Download Feeds
        if: ${{ env.WRT_FEED != '' }}
        uses: actions/download-artifact@main
        with:
          pattern: feed-*
          path: ./site/
          merge-multiple: true

      - name: Generate Index
        if: ${{ env.WRT_FEED != '' }}
        run: python3 ./Scripts/Index.py ./site/

      - name: Deploy to Cloudflare Pages
        if: ${{ env.WRT_FEED != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{secrets.CLOUDFLARE_API_TOKEN}}
          accountId: ${{secrets.CLOUDFLARE_ACCOUNT_ID}}
          command: pages deploy ./site/ --project-name=${{env.WRT_PROJECT}} --branch=main --commit-dirty=true
