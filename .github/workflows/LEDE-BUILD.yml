#CI项目
name: LEDE-QCA

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      HASH:
        description: '手动指定源码哈希，7位或完整均可。'
        required: false
        type: string

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX, IPQ807X]
        include:
          #编译用户态插件（同架构通用）
          - CONFIG: IPQ60XX
            FEED_USER: true
          - CONFIG: IPQ807X
            FEED_USER: false
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: LEDE
      #默认WIFI名称
      WRT_SSID: LEDE
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/coolsnowwolf/lede.git
      #源码分支
      WRT_BRANCH: master
      #源码名称
      WRT_SOURCE: coolsnowwolf/lede
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_COMMIT: ${{inputs.HASH}}
      #用户态插件（编译成软件源，不装进固件）
      WRT_FEED_USER: ${{matrix.FEED_USER}}
      #软件源域名（改成你自己的，Pages 项目名取第一段，如 lede-feed.pages.dev → lede-feed）
      WRT_FEED_HOST: &FEED_HOST 'lede-feed.pages.dev'
      #排除的内核模块
      WRT_KMOD_EXCLUDE: ''

  #调用公用软件源发布WRT-PUBLISH.yml
  publish:
    name: Publish Feed
    needs: config
    uses: ./.github/workflows/WRT-PUBLISH.yml
    with:
      WRT_FEED_HOST: *FEED_HOST
    secrets: inherit
